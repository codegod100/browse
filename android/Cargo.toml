[package]
name = "browse"
version = "0.1.0"
edition = "2021"
description = "Browse — Radicle repo viewer (Vidya shell + Gleam logic)"
license = "MIT"
publish = false
build = "build.rs"

# cargo-apk 0.10 rejects a [workspace] table here; host/ keeps its own workspace.

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[lib]
name = "browse"
path = "src/lib.rs"
# lib-only: cargo-apk panics if this package also has [[bin]] targets
crate-type = ["cdylib", "rlib"]

[dependencies]
vidya = { path = "../../vidya" }
# Shared glow + fonts only — do NOT enable wayland/x11 here (feature unification
# would pull them into the Android build and can make the activity exit immediately).
eframe = { version = "0.31", default-features = false, features = [
    "default_fonts",
    "glow",
] }
egui = { version = "0.31", default-features = false }
wasmtime = { version = "29", default-features = false, features = [
    "cranelift",
    "runtime",
] }
radicle = { version = "0.25", default-features = false }
radicle-job = { path = "vendor/radicle-job" }
thiserror = "2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# Matching radicle's git2 (object kinds for tree vs blob).
git2 = { version = "0.21", default-features = false }

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.31", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.31", default-features = false, features = [
    "default_fonts",
    "glow",
    "android-native-activity",
] }
android_logger = "0.14"
log = "0.4"
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }
# Cross-compile OpenSSL for radicle/git2 on Android (no system libssl).
openssl = { version = "0.10", features = ["vendored"] }

[package.metadata.android]
package = "uk.nandi.browse"
apk_name = "browse"
# aarch64 = physical phones; x86_64 = Waydroid / emulators
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]
resources = "res"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 34

[package.metadata.android.application]
label = "Browse"
has_code = false
orientations = ["Portrait", "Landscape"]
theme = "@android:style/Theme.DeviceDefault.NoActionBar"
icon = "@mipmap/ic_launcher"

# Shared CI/debug keystore so successive installs upgrade cleanly.
[package.metadata.android.signing.release]
path = "ci.keystore"
keystore_password = "android"
key_alias = "androiddebugkey"
key_password = "android"
