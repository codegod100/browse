[package]
name = "radicle-job"
version = "0.6.0"
edition = "2021"
description = "Radicle Job Collaborative Object (read-only, vendored for browse)"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
indexmap = { version = "2.7.1", features = ["serde"] }
log = "0.4"
once_cell = "1.20.3"
radicle = { version = "0.25", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.11"
url = { version = "2.5.4", features = ["serde"] }
uuid = { version = "1.13.1", features = ["serde", "v4"] }
